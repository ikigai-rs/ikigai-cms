[package]
name = "ikigai-cms"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Semantic-CMS transreptors for ikigai (urn:cms:*): turn personal content — org-mode bookmarks, notes, library metadata — into ONE RDF graph where everything is a tagged, linkable, queryable resource. First endpoint: org bookmarks -> RDF on the dc:subject tag axis a Zotero export already speaks."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-cms"
homepage = "https://github.com/ikigai-rs/ikigai-cms"
readme = "README.md"
keywords = ["ikigai", "roc", "rdf", "bookmarks", "cms"]
categories = ["wasm"]

[dependencies]
# The released kernel, consumed from crates.io — the SAME version the hosts use,
# so a host links exactly one `ikigai-core` (no duplicate-crate type mismatch).
# 0.1.89 is the floor for `space_iri` (the space's name, `SPACE_ID`) and for `bind`
# dropping a name, so a host that extends this space never carries it over
# different doors. Under 0.x a caret is a range: this admits <0.2.0.
ikigai-core = "0.1.89"

[dev-dependencies]
futures = "0.3"
# The module recipe as one test (`tests/conformance.rs`): every endpoint this crate
# binds, every action each declares, every checkable rule at once. 0.6.0 is the floor
# for SPACE-NAME (`Suite::self_named_space`). Under 0.x a caret is a CEILING too:
# "0.6.0" admits <0.7.0, so a newer definition of "done" is a deliberate bump here.
ikigai-conformance = "0.6.0"
